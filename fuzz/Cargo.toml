# The Argon QR Vault's fuzz targets. This is its own workspace, so that a
# nightly `cargo fuzz` build with sanitizer flags never shares a target
# directory or a resolved lock file with the pinned stable workspace in
# `rust/`.
[package]
name = "aqrv-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
aqrv = { path = "../rust/aqrv", features = ["fuzzing"] }
# The same Faraday commit as `rust/Cargo.toml`'s.
faraday-crypto = { git = "https://github.com/bitcoinpasada/faraday", rev = "0849ae18dac00c54e1f1d34051c26fd6a0bcdc82", features = ["unchecked"] }

[profile.release]
debug = true

[[bin]]
name = "aqrv_envelope"
path = "fuzz_targets/aqrv_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aqrv_item"
path = "fuzz_targets/aqrv_item.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aqrv_open"
path = "fuzz_targets/aqrv_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aqrv_recognise"
path = "fuzz_targets/aqrv_recognise.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aqrv_text"
path = "fuzz_targets/aqrv_text.rs"
test = false
doc = false
bench = false
